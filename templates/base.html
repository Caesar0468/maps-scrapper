<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}HY Food Intel{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="grain"></div>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="cursor-glow" id="cursor-glow"></div>
  <nav class="topbar">
    <a href="/" class="brand magnetic" aria-label="HY Food Intel home">
      <span class="brand-mark"><span>H</span><span>Y</span></span>
      <span class="brand-word"><strong>Food Intel</strong><small>Hyderabad · culinary intelligence</small></span>
    </a>
    <div class="topbar-right">
      <span class="live-pill"><i></i> LIVE SIGNALS</span>
      <span class="hidden sm:inline meta-copy">AI enriched · map intelligence</span>
      <a href="/api/export-csv" class="top-action">Export <span>↗</span></a>
    </div>
  </nav>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const glow = document.getElementById('cursor-glow');
      if (glow && matchMedia('(pointer:fine)').matches) {
        let tx=0, ty=0, x=0, y=0;
        window.addEventListener('pointermove', e => { tx=e.clientX; ty=e.clientY; });
        const loop=()=>{ x += (tx-x)*.12; y += (ty-y)*.12; glow.style.transform=`translate3d(${x}px,${y}px,0)`; requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
      if (window.anime) {
        anime.animate('.brand,.topbar-right',{opacity:[0,1],y:[-10,0],duration:800,ease:'out(4)'});
      }
    });
  </script>
</body>
</html>
