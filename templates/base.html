<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HY Food Intel{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800">
  <nav class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <a href="/" class="flex items-center gap-2 font-bold text-lg text-blue-700">
      <span>🍽️</span> HY Food Intel
    </a>
    <div class="flex items-center gap-3 text-sm">
      <span class="hidden sm:inline text-slate-500">Telangana · ORR · Offline AI</span>
      <a href="/api/export-csv" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium">Export CSV</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
